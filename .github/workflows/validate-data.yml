name: Validate data

on:
  pull_request:
    paths: ['public/data/**', 'scripts/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      # HEAD is the PR merge commit; HEAD^1 is the base branch tip.
      # Removals are allowed here (the PR is reviewed); the auto-update
      # workflows keep the strict no-shrink check.
      - name: Validate data files
        run: node scripts/validate-data.js --base HEAD^1 --allow-shrink
